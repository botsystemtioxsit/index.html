plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tioxsit.trollbattle'
    compileSdk 34

    defaultConfig {
        applicationId "com.tioxsit.trollbattle"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.0.2"
    }

    signingConfigs {
        // Постоянный ключ подписи. Файл ключа CI достаёт из секрета
        // ANDROID_KEYSTORE_BASE64 (см. README → «Подпись APK»). Без секрета
        // блок пустой, и сборка подписывается одноразовым отладочным ключом,
        // как раньше.
        stable {
            def ksFile = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
