name: Deploy Database Rules on Push
'on':
  push:
    branches:
      - main
    paths:
      - 'database.rules.json'
      - 'firebase.json'
  workflow_dispatch: {}
    # ^ кнопка "Run workflow" на вкладке Actions — запуск вручную,
    #   без необходимости коммитить именно эти два файла

jobs:
  deploy_rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Та же самая аутентификация, что уже проверена и работает
      # (см. firebase-functions-deploy.yml) — просто деплоим другую цель.
      # Realtime Database Rules — часть бесплатного тарифа Spark,
      # никакого Blaze/биллинга для этого не требуется.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      # database.rules.json committed to git only ever contains the literal
      # placeholder __ROLE_GRANT_KEY__ — this repo is public, so the real
      # value (a GitHub Actions secret, never printed/logged) is substituted
      # in right before deploying, not stored in the file itself. Rotate it
      # by updating the ROLE_GRANT_KEY repo secret (Settings → Secrets and
      # variables → Actions) and the matching secret on the role-gateway
      # Cloudflare Worker (battle-admin-bot repo) together — they must match.
      - run: |
          sed -i "s/__ROLE_GRANT_KEY__/${ROLE_GRANT_KEY}/" database.rules.json
        env:
          ROLE_GRANT_KEY: ${{ secrets.ROLE_GRANT_KEY }}

      - run: npx firebase-tools deploy --only database --project zolotaya-kletka
