name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows-installer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop app dependencies
        working-directory: desktop
        run: npm ci

      - name: Build .exe installer (native Windows, no wine needed)
        working-directory: desktop
        run: npm run build:win

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with installer attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-windows-latest
          name: Тролль-Баттл (Windows) — последняя сборка
          files: desktop/dist/*.exe
          body: |
            Версия ${{ steps.ver.outputs.version }}, сборка ${{ github.run_number }}, из коммита ${{ github.sha }}.
            Этот релиз всегда переиспользуется под фиксированным тегом `desktop-windows-latest` — ссылка на него не меняется между сборками.
